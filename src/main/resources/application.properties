server.port=8081

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

spring.application.name=DrogueriaLosTresHermanos

app.admin.correo=${ADMIN_CORREO:admin@lostreshermanos.com}
app.admin.clave=${ADMIN_CLAVE:}

app.datos=${APP_DATOS:datos/accesos.properties}

app.catalogo=${APP_CATALOGO:datos/catalogo.properties}

spring.config.import=optional:file:${APP_CONEXION:datos/conexion.properties}
app.fotos=${APP_FOTOS:datos/fotos}
app.fotos-repositorio=${APP_FOTOS_REPOSITORIO:fotos-productos}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}
server.servlet.session.tracking-modes=cookie

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
